# Checks all links in Markdown files (sources!). Weekly, on Markdown changes and on demand.
# Not a commit hook: needs network and is slow. Config: lychee.toml.
name: links

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  push:
    paths: ["**/*.md", "lychee.toml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --no-progress '**/*.md'
          fail: true
