# Publishes the decks on GitHub Pages (Settings > Pages > Source: GitHub Actions).
# Only what the decks load is uploaded: index.html, *.index.html, src/ and data/*/img/.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Collect the site
        run: |
          mkdir _site
          cp index.html ./*.index.html _site/
          cp -r src _site/src
          for d in data/*/img; do
            [ -d "$d" ] && mkdir -p "_site/$d" && cp -r "$d/." "_site/$d/"
          done
      - uses: actions/upload-pages-artifact@v5.0.0
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
