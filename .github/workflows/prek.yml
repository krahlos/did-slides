# Runs the same prek hooks as locally (prek.toml) on every push and pull request.
name: prek

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: j178/prek-action@v3.1.1
        with:
          prek-version: "0.4.x"
