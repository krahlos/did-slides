# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

default_install_hook_types = ["pre-commit", "commit-msg"]
# Fremdcode und erzeugte Folien nicht anfassen
exclude = '^src/vendor/|\.index\.html$'

[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "check-added-large-files"
args = ["--maxkb=1000"]

[[repos.hooks]]
id = "check-merge-conflict"

[[repos.hooks]]
id = "check-toml"

[[repos.hooks]]
id = "check-json"

[[repos.hooks]]
id = "detect-private-key"

[[repos.hooks]]
id = "end-of-file-fixer"

[[repos.hooks]]
id = "trailing-whitespace"
args = ["--markdown-linebreak-ext=md"]

[[repos.hooks]]
id = "mixed-line-ending"
args = ["--fix=lf"]

[[repos.hooks]]
id = "check-case-conflict"

[[repos.hooks]]
id = "check-vcs-permalinks"

[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "v4.4.0"

[[repos.hooks]]
id = "conventional-pre-commit"
stages = ["commit-msg"]
args = ["--verbose"]

# Nur Recherche-Notizen und README: slides.md nutzt ---/key: value/--- als Folienkopf,
# das liest markdownlint als Setext-Überschriften.
[[repos]]
repo = "https://github.com/DavidAnson/markdownlint-cli2"
rev = "v0.23.2"

[[repos.hooks]]
id = "markdownlint-cli2"
args = ["--fix"]
exclude = '(^|/)slides\.md$'

# Kein codespell: kennt nur Englisch und "korrigiert" deutsche Wörter (als→also, vor→for).

# Baseline neu erzeugen: uvx detect-secrets@1.5.0 scan --exclude-files '^src/vendor/|\.index\.html$' > .secrets.baseline
[[repos]]
repo = "https://github.com/Yelp/detect-secrets"
rev = "v1.5.0"

[[repos.hooks]]
id = "detect-secrets"
args = ["--baseline", ".secrets.baseline"]

[[repos]]
repo = "https://github.com/ComPWA/taplo-pre-commit"
rev = "v0.9.3"

[[repos.hooks]]
id = "taplo-format"

[[repos]]
repo = "meta"

[[repos.hooks]]
id = "check-hooks-apply"

[[repos.hooks]]
id = "check-useless-excludes"

[[repos]]
repo = "local"

[[repos.hooks]]
id = "node-check"
name = "node --check (Syntax der JS-Dateien)"
language = "system"
entry = "node --check"
files = '^src/.*\.js$'

# Hält die eingecheckten *.index.html synchron mit den Quellen.
# Ändert der Build etwas, schlägt der Hook fehl: neu gebaute Dateien stagen und erneut committen.
[[repos.hooks]]
id = "build-slides"
name = "Folien bauen (node src/build.js)"
language = "system"
entry = "node src/build.js"
pass_filenames = false
files = '^(data/[^/]+/slides\.md|src/(build\.js|vendor/.*))$'

[[repos.hooks]]
id = "sort-permissions"
name = "sort claude permission lists"
language = "system"
entry = '''bash -c 'for f in "$@"; do jq -S --indent 2 ".permissions |= map_values(sort)" "$f" > "$f.tmp" && mv "$f.tmp" "$f"; done' --'''
files = "^\\.claude/settings(\\.local)?\\.json$"
