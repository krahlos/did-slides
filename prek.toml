# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

default_install_hook_types = ["pre-commit", "commit-msg"]
# Leave vendored code and generated slides alone
exclude = '^src/vendor/|\.index\.html$'

[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "check-added-large-files"
args = ["--maxkb=1000"]

[[repos.hooks]]
id = "check-merge-conflict"

[[repos.hooks]]
id = "check-toml"

[[repos.hooks]]
id = "check-json"

[[repos.hooks]]
id = "detect-private-key"

[[repos.hooks]]
id = "end-of-file-fixer"

[[repos.hooks]]
id = "trailing-whitespace"
args = ["--markdown-linebreak-ext=md"]

[[repos.hooks]]
id = "mixed-line-ending"
args = ["--fix=lf"]

[[repos.hooks]]
id = "check-case-conflict"

[[repos.hooks]]
id = "check-vcs-permalinks"

[[repos.hooks]]
id = "check-executables-have-shebangs"

[[repos.hooks]]
id = "pretty-format-json"
args = ["--autofix", "--indent=2", "--no-ensure-ascii"]

[[repos]]
repo = "https://github.com/koalaman/shellcheck-precommit"
rev = "v0.11.0"

[[repos.hooks]]
id = "shellcheck"

[[repos]]
repo = "https://github.com/scop/pre-commit-shfmt"
rev = "v3.13.1-1"

[[repos.hooks]]
id = "shfmt"
args = ["-i", "2", "-ci", "-s", "-bn"]
files = '\.sh$'

[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "v4.4.0"

[[repos.hooks]]
id = "conventional-pre-commit"
stages = ["commit-msg"]
args = ["--verbose"]

# Research notes and docs only: slides.md uses ---/key: value/--- slide headers,
# which markdownlint reads as setext headings.
[[repos]]
repo = "https://github.com/DavidAnson/markdownlint-cli2"
rev = "v0.23.2"

[[repos.hooks]]
id = "markdownlint-cli2"
args = ["--fix"]
exclude = '(^|/)slides\.md$'

# No codespell: English-only, it "fixes" German words in slides and notes (als→also, vor→for).

# Regenerate the baseline: uvx detect-secrets@1.5.0 scan --exclude-files '^src/vendor/|\.index\.html$' > .secrets.baseline
[[repos]]
repo = "https://github.com/Yelp/detect-secrets"
rev = "v1.5.0"

[[repos.hooks]]
id = "detect-secrets"
args = ["--baseline", ".secrets.baseline"]

[[repos]]
repo = "https://github.com/ComPWA/taplo-pre-commit"
rev = "v0.9.3"

[[repos.hooks]]
id = "taplo-format"

[[repos]]
repo = "meta"

[[repos.hooks]]
id = "check-hooks-apply"

[[repos.hooks]]
id = "check-useless-excludes"

[[repos]]
repo = "local"

[[repos.hooks]]
id = "node-check"
name = "node --check (JS syntax)"
language = "system"
entry = "node --check"
files = '^src/.*\.js$'

# Keeps the committed *.index.html in sync with their sources.
# If the build changes anything the hook fails: stage the rebuilt files and commit again.
[[repos.hooks]]
id = "build-slides"
name = "build slides (node src/build.js)"
language = "system"
entry = "node src/build.js"
pass_filenames = false
files = '^(data/[^/]+/slides\.md|src/(build\.js|vendor/.*))$'

[[repos.hooks]]
id = "sort-permissions"
name = "sort claude permission lists"
language = "system"
entry = '''bash -c 'for f in "$@"; do jq -S --indent 2 ".permissions |= map_values(sort)" "$f" > "$f.tmp" && mv "$f.tmp" "$f"; done' --'''
files = "^\\.claude/settings(\\.local)?\\.json$"
